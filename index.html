<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona.svg">
<meta name="theme-color" content="#020b16">
<style>
  :root { --c1:#38bdf8; --c2:#22d3ee; --c3:#bae6fd; --fondo:#020b16; --vetro:rgba(7,28,50,.66); --bordo:rgba(56,189,248,.4); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 45%, #06223d 0%, var(--fondo) 72%); color:var(--c3);
               font-family:Bahnschrift, "Segoe UI Semilight", "Segoe UI", sans-serif; overflow:hidden; }
  #cv { position:fixed; inset:0; width:100%; height:100%; }
  #titolo { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); font-size:clamp(18px,3vw,30px); font-weight:600; letter-spacing:.22em; color:#e0f2fe;
            text-shadow:0 0 18px var(--c2); transition:opacity .6s; pointer-events:none; white-space:nowrap; }
  body.aperto #titolo { opacity:0; }
  #stato { position:fixed; left:50%; top:calc(50% + 34px); transform:translateX(-50%); font-size:13px; letter-spacing:.2em; color:var(--c1);
           transition:top .9s cubic-bezier(.2,.8,.2,1); white-space:nowrap; text-transform:uppercase; }
  body.aperto #stato { top:58px; }
  #testa { position:fixed; top:0; left:0; right:0; height:48px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:12px; letter-spacing:.16em;
           color:var(--c1); border-bottom:1px solid var(--bordo); background:linear-gradient(180deg, rgba(7,28,50,.85), transparent); transform:translateY(-100%); opacity:0; transition:.8s; }
  #testa b { font-size:18px; letter-spacing:.4em; color:#e0f2fe; text-shadow:0 0 14px var(--c2); }
  body.aperto #testa { transform:none; opacity:1; }
  #plancia { position:fixed; inset:78px 18px 76px; display:grid; grid-template-columns:clamp(230px,24vw,340px) 1fr clamp(230px,24vw,340px); gap:16px; pointer-events:none; }
  .colonna { display:grid; gap:12px; min-height:0; pointer-events:auto; }
  .sinistra { grid-template-rows:auto auto 1fr; grid-column:1; } .destra { grid-template-rows:1fr 1fr 1fr; grid-column:3; }
  .pannello { position:relative; background:var(--vetro); border:1px solid var(--bordo); padding:12px 14px; min-height:0; overflow:hidden; display:flex; flex-direction:column;
              opacity:0; transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s; }
  .sinistra .pannello { transform:translateX(-125%); } .destra .pannello { transform:translateX(125%); }
  body.aperto .pannello { transform:none; opacity:1; }
  .pannello:nth-child(2) { transition-delay:.12s; } .pannello:nth-child(3) { transition-delay:.24s; }
  .pannello::before, .pannello::after { content:""; position:absolute; width:12px; height:12px; border:2px solid var(--c2); }
  .pannello::before { top:-1px; left:-1px; border-right:0; border-bottom:0; } .pannello::after { right:-1px; bottom:-1px; border-left:0; border-top:0; }
  h2 { margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--c1); display:flex; justify-content:space-between; }
  h2 span { color:var(--c2); }
  .grande { font-size:clamp(26px,3vw,40px); font-weight:300; color:#e0f2fe; text-shadow:0 0 14px rgba(34,211,238,.6); line-height:1.1; }
  .piccolo { font-size:13px; opacity:.88; margin-top:2px; }
  .barra { height:6px; background:rgba(56,189,248,.18); margin:8px 0 4px; } .barra i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--c1),var(--c2)); box-shadow:0 0 10px var(--c2); transition:width .6s; }
  ul { list-style:none; margin:0; padding:0; overflow:auto; font-size:13px; line-height:1.35; }
  li { padding:4px 0; border-bottom:1px solid rgba(56,189,248,.14); } li span { color:var(--c2); }
  #log { flex:1; overflow:auto; font-size:12.5px; line-height:1.5; } #log div { margin:2px 0; } #log a { color:var(--c2); }
  .tu { opacity:.65; } .sys { color:#7aa7c7; font-size:11.5px; }
  #onda { width:100%; flex:1; min-height:50px; }
  #barra-comandi { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; padding:8px 12px; border:1px solid transparent; transition:.8s; }
  body.aperto #barra-comandi { background:var(--vetro); border-color:var(--bordo); }
  button { background:rgba(34,211,238,.08); color:var(--c3); border:1px solid var(--c1); padding:10px 24px; font:inherit; font-size:14px; letter-spacing:.12em; cursor:pointer; transition:.25s; white-space:nowrap; }
  button:hover { background:rgba(34,211,238,.22); box-shadow:0 0 18px rgba(34,211,238,.5); }
  button:focus-visible { outline:2px solid var(--c3); outline-offset:3px; }
  .extra { opacity:0; pointer-events:none; max-width:0; padding-left:0; padding-right:0; overflow:hidden; border-width:0; }
  body.aperto .extra { opacity:1; pointer-events:auto; max-width:200px; padding:10px 16px; border-width:1px; }
  @media (max-width:900px) {
    #plancia { grid-template-columns:1fr; inset:42vh 10px 72px; overflow:auto; pointer-events:auto; align-content:start; }
    .sinistra, .destra { grid-column:1; grid-template-rows:none; } .pannello { min-height:96px; }
    .sinistra .pannello, .destra .pannello { transform:translateY(40px); } #onda { height:60px; flex:none; } #testa { font-size:10px; padding:0 10px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="titolo">J.A.R.V.I.S</div><div id="stato">In standby</div>
<div id="testa"><span id="s-cervello"></span><b>JARVIS</b><span id="s-pc"></span></div>
<main id="plancia">
  <section class="colonna sinistra">
    <article class="pannello"><h2>Data e ora</h2><div class="grande" id="orologio">--:--:--</div><div class="piccolo" id="data"></div>
      <div class="barra"><i id="b-batt"></i></div><div class="piccolo" id="batt">Batteria…</div></article>
    <article class="pannello"><h2>Meteo <span>Milano</span></h2><div class="grande" id="m-temp">--°C</div><div class="piccolo" id="m-desc">Carico il meteo…</div><div class="piccolo" id="m-dom"></div></article>
    <article class="pannello"><h2>Voce</h2><canvas id="onda"></canvas></article>
  </section>
  <section class="colonna destra">
    <article class="pannello"><h2>Email non lette <span id="n-posta"></span></h2><ul id="e-posta"></ul></article>
    <article class="pannello"><h2>Calendario <span id="n-cal"></span></h2><ul id="e-cal"></ul></article>
    <article class="pannello"><h2>Conversazione</h2><div id="log"></div></article>
  </section>
</main>
<div id="barra-comandi"><button class="extra" id="b-zitto">Zittisci</button><button id="btn">Attiva Jarvis</button><button class="extra" id="b-voce">Voce</button><button class="extra" id="b-agg">Aggiorna</button></div>

<script>
// ---------------- CONFIGURAZIONE ----------------
// Cervello online: solo Groq (gratis, funziona anche dal telefono con il PC spento). Se il PC è acceso, Ollama fa da riserva.
const PRIMA_IL_PC = false;   // metti true per provare prima Ollama sul PC (privato, ma più lento)
const OLLAMA_URL = "/ollama";   // passa dall'agente sul PC (funziona anche dal telefono)
const MODELLO_LOCALE = "gemma3:1b";   // vedi la guida per sceglierne uno adatto al tuo PC
const NOME = "jarvis";
// Come il riconoscimento vocale può scrivere "Jarvis" (lo sente spesso in modi diversi)
const VARIANTI = ["jarvis", "giarvis", "jarvi", "giarvi", "jarves", "giarves", "iarvis", "garvis", "yarvis", "jervis", "gervis", "jarbis", "giaris", "jaris", "charvis", "chervis", "jarvice", "giarvice", "jarvys"];
const PAROLA_ORDINE = new RegExp("\\b(" + VARIANTI.join("|") + ")\\b");
const dopoParolaOrdine = f => { const m = f.match(PAROLA_ORDINE); return m ? f.slice(m.index + m[0].length).replace(/^[ ,.:;!?-]+/, "").trim() : null; };
const CITTA = "Milano";            // città per il meteo (cambiala con la tua)
const BRIEFING_AUTOMATICO = true;      // all'accensione, al mattino, Jarvis ti dà il riepilogo della giornata
const FINESTRA_MS = 25000;   // dopo una risposta resta in ascolto per questo tempo senza bisogno di dire "Jarvis"
const ISTRUZIONI =
  "Sei Jarvis, un assistente personale elegante, spiritoso e molto efficiente, come quello " +
  "di Tony Stark. Rispondi sempre in italiano, in massimo 3 frasi brevi, senza elenchi, " +
  "senza asterischi e senza markdown, perché le risposte vengono lette ad alta voce. " +
  "Chiama l'utente 'signore'.";
// -------------------------------------------------

const $ = id => document.getElementById(id);
const log = $("log"), btn = $("btn"), etichetta = $("stato");
const TELEFONO = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);   // su telefono: tocca e parla, senza parola d'ordine
let finestraFino = 0, ultimoParlato = "", fineParlato = 0, silenzio = false;
const TESTI = { idle:"In standby", ascolto:"In ascolto", pensa:"Elaboro…", parla:"Risposta in corso" };

let stato = "idle", voce = null, parlando = false, attivo = false, inAttesa = false, occupato = false, storia = [];

function impostaStato(s) { stato = s; etichetta.textContent = TESTI[s]; }
function scrivi(chi, testo, classe = "") {
  const r = document.createElement("div");
  r.className = classe; r.textContent = chi ? chi + ": " + testo : testo;
  log.appendChild(r); log.scrollTop = log.scrollHeight;
}

// ----- Voce -----
const FEMMINILI = /elsa|isabella|paola|ginevra|fabiola|irma|palmira|pierina/i;
const vociItaliane = () => speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").startsWith("it"));
function scegliVoce() {                      // preferisce una voce maschile naturale
  const it = vociItaliane();
  let salvata = ""; try { salvata = localStorage.getItem("jarvis_voce") || ""; } catch (e) {}
  voce = it.find(v => v.name === salvata) || it.find(v => /diego/i.test(v.name)) || it.find(v => /giuseppe/i.test(v.name))
      || it.find(v => /cosimo|luca|riccardo/i.test(v.name)) || it.find(v => !FEMMINILI.test(v.name)) || it[0] || null;
}
async function cambiaVoce() {
  const it = vociItaliane();
  if (!it.length) { await parla("Non trovo voci italiane, signore."); return; }
  voce = it[(it.indexOf(voce) + 1) % it.length];
  try { localStorage.setItem("jarvis_voce", voce.name); } catch (e) {}
  scrivi("", "Voce: " + voce.name, "sys");
  await parla("Questa è la mia nuova voce, signore. Che ne pensa?");
}
speechSynthesis.onvoiceschanged = scegliVoce; scegliVoce();

function parla(testo) {
  return new Promise(resolve => {
    scrivi("Jarvis", testo);
    ultimoParlato = testo;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(testo);
    u.lang = "it-IT"; u.pitch = 0.9; if (voce) u.voice = voce;
    u.onstart = () => { parlando = true; impostaStato("parla"); };
    const fine = () => { parlando = false; fineParlato = Date.now(); impostaStato(attivo ? "ascolto" : "idle"); resolve(); };
    u.onend = fine;
    u.onerror = e => {
      if (e.error === "not-allowed") scrivi("", "Il browser blocca la voce finché non clicchi sulla pagina: clicca una volta in un punto vuoto.", "sys");
      fine();
    };
    speechSynthesis.speak(u);
  });
}

// ----- Cervello: locale (Ollama) con riserva cloud opzionale -----
const pausa = ms => new Promise(r => setTimeout(r, ms));

async function chiediLocale(msg = storia, opz = { num_ctx:2048, num_predict:200 }, sistema = ISTRUZIONI) {
  const r = await fetch(OLLAMA_URL + "/api/chat", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ model:MODELLO_LOCALE, stream:false, keep_alive:"5m",
      ...(MODELLO_LOCALE.startsWith("qwen3") ? { think:false } : {}),   // niente "ragionamento" lungo prima di rispondere
      options:opz,                         // contesto piccolo e risposte brevi = più veloce
      messages:[{ role:"system", content:sistema }, ...msg] })
  });
  const dati = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dati.error || ("codice " + r.status));
  return (dati.message?.content || "").replace(/<think>[\s\S]*?<\/think>/g, "").replace(/\*/g, "").trim();
}

// ----- Groq (gratuito, molto veloce) -----
const GROQ_INTERMEDIARIO = "https://jarvis-groq.andre-abbiati2207.workers.dev";   // se il browser blocca Groq: incolla qui l'indirizzo del tuo Worker, es. "https://jarvis-groq.tuonome.workers.dev"
const GROQ_URL = GROQ_INTERMEDIARIO || "https://api.groq.com/openai/v1";
const hostGroq = () => { try { return new URL(GROQ_URL).host; } catch (e) { return GROQ_URL; } };
const descriviErrore = e => e instanceof TypeError ? "non raggiungibile: " + hostGroq() + " (rete, blocco del browser o permessi del Worker)" : e.message;
// I modelli Llama sono stati ritirati da Groq ad agosto 2026: questi sono i sostituti. Se possibile, Jarvis aggiorna l'elenco da solo.
let modelliGroq = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"];   // provati in ordine
let modelliAggiornati = false, ultimoModelloGroq = "";
let CHIAVE_GROQ = "";
try { CHIAVE_GROQ = localStorage.getItem("jarvis_groq") || ""; localStorage.removeItem("jarvis_key"); localStorage.removeItem("jarvis_key_no"); } catch (e) {}   // elimina la vecchia chiave Gemini

function chiediChiaveGroq(forza = false) {
  if (forza) { CHIAVE_GROQ = ""; try { localStorage.removeItem("jarvis_groq"); } catch (e) {} }
  if (!CHIAVE_GROQ) {
    const k = prompt("Chiave API di Groq (gratuita su console.groq.com/keys). Resta solo su questo dispositivo. Lascia vuoto per saltare:");
    if (k && k.trim()) { CHIAVE_GROQ = k.trim(); try { localStorage.setItem("jarvis_groq", CHIAVE_GROQ); } catch (e) {} }
  }
  return !!CHIAVE_GROQ;
}
async function aggiornaModelliGroq() {       // chiede a Groq quali modelli esistono (serve il Worker aggiornato; altrimenti restano quelli sopra)
  try {
    const r = await fetch(GROQ_URL + "/models", { headers:{ Authorization:"Bearer " + CHIAVE_GROQ } });
    if (!r.ok) return;
    const ids = ((await r.json()).data || []).map(m => m.id).filter(id => !/whisper|tts|orpheus|guard|compound|safeguard|embed|vision|image/i.test(id));
    const preferiti = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"].filter(id => ids.includes(id));
    const elenco = [...preferiti, ...ids.filter(id => !preferiti.includes(id))].slice(0, 4);
    if (elenco.length) { modelliGroq = elenco; scrivi("", "Modelli Groq disponibili: " + elenco.join(", "), "sys"); }
  } catch (e) {}
}
async function chiediGroq(msg, opz = {}, sistema = ISTRUZIONI) {
  let ultimo = "nessuna risposta";
  if (!modelliAggiornati) { modelliAggiornati = true; await aggiornaModelliGroq(); }
  for (const modello of modelliGroq) {
    const r = await fetch(GROQ_URL + "/chat/completions", {
      method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CHIAVE_GROQ },
      body:JSON.stringify({ model:modello, max_completion_tokens:(opz.num_predict || 300) * 3,   // margine per il ragionamento interno dei modelli gpt-oss
        ...(modello.startsWith("openai/gpt-oss") ? { reasoning_effort:"low" } : {}),
        messages:[{ role:"system", content:sistema }, ...msg] })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { const t = (d.choices?.[0]?.message?.content || "").replace(/\*/g, "").trim(); if (t) { ultimoModelloGroq = modello; return t; } }
    ultimo = (typeof d.error === "string" ? d.error : d.error?.message) || ("codice " + r.status);
    if (r.status === 401) break;                       // chiave sbagliata: inutile provare l'altro modello
    scrivi("", `Groq (${modello}): ${ultimo}`, "sys");
  }
  throw new Error(ultimo);
}
async function provaGroq() {
  if (!CHIAVE_GROQ) { await parla("Non ho ancora una chiave Groq, signore. Dica: cambia chiave Groq."); return; }
  impostaStato("pensa");
  try {
    const t = await chiediGroq([{ role:"user", content:"Rispondi con una sola parola: pronto." }]);
    scrivi("", `Groq (${ultimoModelloGroq}) ha risposto: ${t}`, "sys");
    await parla("Groq funziona, signore.");
  } catch (e) {
    scrivi("", "Groq: " + descriviErrore(e), "sys");
    await parla("Groq non risponde, signore. Il motivo è scritto nel registro.");
  }
}

function primaConfigurazione() {          // alla prima attivazione chiede le chiavi, una volta sola
  const letto = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const segna = k => { try { localStorage.setItem(k, "1"); } catch (e) {} };
  if (!CHIAVE_GROQ && !letto("jarvis_groq_no") && !chiediChiaveGroq()) segna("jarvis_groq_no");
}

// Prova i cervelli disponibili in ordine; restituisce il testo o null
async function chiediTesto(msg, opz, sistema) {
  const vie = [];
  if (CHIAVE_GROQ) vie.push(["Groq", () => chiediGroq(msg, opz, sistema)]);
  const pc = ["PC", () => chiediLocale(msg, opz, sistema)];
  if (agenteAttivo) { if (PRIMA_IL_PC) vie.unshift(pc); else vie.push(pc); }
  for (const [nome, prova] of vie) {
    try { const t = await prova(); if (t) return t; }
    catch (e) { scrivi("", nome + ": " + descriviErrore(e), "sys"); }
  }
  return null;
}

// Parlatore a frasi: mette in coda ogni frase appena è pronta, così Jarvis comincia a parlare prima che la risposta sia finita
function creaParlatore() {
  let attive = 0, chiuso = false, risolvi; const finito = new Promise(r => { risolvi = r; });
  const termina = () => { if (chiuso && attive === 0) { parlando = false; fineParlato = Date.now(); impostaStato(attivo ? "ascolto" : "idle"); risolvi(); } };
  return {
    aggiungi(testo) {
      if (silenzio || !testo.trim()) return;
      attive++;
      const u = new SpeechSynthesisUtterance(testo);
      u.lang = "it-IT"; u.pitch = 0.9; if (voce) u.voice = voce;
      u.onstart = () => { parlando = true; impostaStato("parla"); };
      u.onend = u.onerror = () => { attive--; termina(); };
      speechSynthesis.speak(u);
    },
    chiudi() { chiuso = true; termina(); return finito; }
  };
}

// Come chiediGroq, ma in streaming: chiama perFrase(frase) man mano che le frasi sono complete
async function chiediGroqFlusso(msg, opz, sistema, perFrase) {
  let ultimo = "nessuna risposta";
  if (!modelliAggiornati) { modelliAggiornati = true; await aggiornaModelliGroq(); }
  for (const modello of modelliGroq) {
    const r = await fetch(GROQ_URL + "/chat/completions", {
      method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CHIAVE_GROQ },
      body:JSON.stringify({ model:modello, stream:true, max_completion_tokens:(opz.num_predict || 300) * 3,
        ...(modello.startsWith("openai/gpt-oss") ? { reasoning_effort:"low" } : {}),
        messages:[{ role:"system", content:sistema }, ...msg] })
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      ultimo = (typeof d.error === "string" ? d.error : d.error?.message) || ("codice " + r.status);
      if (r.status === 401) break;
      scrivi("", `Groq (${modello}): ${ultimo}`, "sys"); continue;
    }
    const lettore = r.body.getReader(), dec = new TextDecoder();
    let buf = "", tutto = "", inCorso = "";
    for (;;) {
      const { done, value } = await lettore.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const riga = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!riga.startsWith("data:") || riga.includes("[DONE]")) continue;
        let pezzo = ""; try { pezzo = JSON.parse(riga.slice(5)).choices?.[0]?.delta?.content || ""; } catch (e) {}
        if (!pezzo) continue;
        tutto += pezzo; inCorso += pezzo;
        let m;
        while ((m = inCorso.match(/^([\s\S]{19,}?[.!?…])\s+/))) { perFrase(m[1]); inCorso = inCorso.slice(m[0].length); }
      }
    }
    if (inCorso.trim()) perFrase(inCorso);
    if (tutto.trim()) { ultimoModelloGroq = modello; return tutto; }
  }
  throw new Error(ultimo);
}

async function rispondi(domanda) {
  storia.push({ role:"user", content:domanda });
  impostaStato("pensa");
  silenzio = false; ultimoParlato = ""; speechSynthesis.cancel();
  const flusso = creaParlatore(); let riga = null, testo = "";
  const dire = t => {
    t = t.replace(/[*#`_]/g, "").trim(); if (!t) return;
    if (!riga) { riga = document.createElement("div"); riga.textContent = "Jarvis:"; log.appendChild(riga); }
    riga.textContent += " " + t; log.scrollTop = log.scrollHeight;
    ultimoParlato += " " + t; flusso.aggiungi(t);
  };
  if (CHIAVE_GROQ) {
    try { testo = await chiediGroqFlusso(storia, {}, sistemaConContesto(), dire); }
    catch (e) { scrivi("", "Groq: " + descriviErrore(e), "sys"); }
  }
  if (!testo) {                                   // niente streaming: provo gli altri cervelli e parlo a risposta completa
    testo = await chiediTesto(storia, undefined, sistemaConContesto()) || "";
    if (testo) dire(testo);
  }
  await flusso.chiudi();
  if (testo) { storia.push({ role:"assistant", content:testo }); if (storia.length > 10) storia = storia.slice(-10); }
  else {
    storia.pop();

const CODICI_METEO = { 0:"sereno", 1:"prevalentemente sereno", 2:"parzialmente nuvoloso", 3:"coperto", 45:"nebbia", 48:"nebbia con brina",
  51:"pioviggine leggera", 53:"pioviggine", 55:"pioviggine intensa", 56:"pioviggine gelata", 57:"pioviggine gelata", 61:"pioggia debole", 63:"pioggia", 65:"pioggia forte",
  66:"pioggia gelata", 67:"pioggia gelata", 71:"neve debole", 73:"neve", 75:"neve forte", 77:"nevischio", 80:"rovesci deboli", 81:"rovesci", 82:"rovesci violenti",
  85:"rovesci di neve", 86:"forti rovesci di neve", 95:"temporale", 96:"temporale con grandine", 99:"forte temporale con grandine" };
const descMeteo = c => CODICI_METEO[c] || "variabile";
async function luogo(nome) {
  const chiave = "jarvis_luogo_" + nome.toLowerCase();
  try { const salvato = JSON.parse(localStorage.getItem(chiave) || "null"); if (salvato) return salvato; } catch (e) {}
  const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(nome) + "&count=5&language=it&format=json");
  const d = await r.json();
  const t = (d.results || []).find(x => x.country_code === "IT") || (d.results || [])[0];
  if (!t) throw new Error("località non trovata");
  const L = { nome:t.name, lat:t.latitude, lon:t.longitude };
  try { localStorage.setItem(chiave, JSON.stringify(L)); } catch (e) {}
  return L;
}
async function meteo(nomeCitta, giorno = 0) {
  const L = await luogo(nomeCitta);
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=3`);
  const d = await r.json();
  if (!d.daily) throw new Error("risposta meteo non valida");
  return { luogo:L.nome, adesso:d.current?.temperature_2m, codiceAdesso:d.current?.weather_code,
           max:d.daily.temperature_2m_max[giorno], min:d.daily.temperature_2m_min[giorno], pioggia:d.daily.precipitation_sum[giorno], codice:d.daily.weather_code[giorno] };
}
function fraseMeteo(m, giorno, conLuogo) {
  const n = x => Math.round(x), mm = n(m.pioggia);
  const piove = m.pioggia >= 0.5 ? ` Sono previsti circa ${mm} ${mm === 1 ? "millimetro" : "millimetri"} di pioggia.` : "";
  if (giorno === 0) return `${conLuogo ? "A " + m.luogo + " ci" : "Ci"} sono ${n(m.adesso)} gradi, ${descMeteo(m.codiceAdesso)}. Oggi massima ${n(m.max)}, minima ${n(m.min)}.${piove}`;
  return `Domani${conLuogo ? " a " + m.luogo : ""}: ${descMeteo(m.codice)}, massima ${n(m.max)} gradi, minima ${n(m.min)}.${piove}`;
}
async function dimmiMeteo(c) {
  const giorno = /\bdomani\b/.test(c) ? 1 : 0;
  const resto = c.replace(/\b(domani|oggi|adesso|ora|stasera|stamattina)\b/g, "").replace(/in questo momento/g, "").trim();
  const mc = resto.match(/\b(?:a|ad|in|su|per)\s+([a-zàèéìòù' ]+)$/);
  const citta = mc ? mc[1].trim() : CITTA;
  try { const m = await meteo(citta, giorno); await dici([fraseMeteo(m, giorno, !!mc)]); }
  catch (e) { await parla(e.message === "località non trovata" ? "Non conosco quella località, signore." : "Non riesco a ottenere il meteo in questo momento, signore."); }
}

  if (agenteAttivo) {
    const c = await agenteDati({ azione:"calendario_oggi", giorno:0 });
    if (c?.configurata && !c.errore) {
      const ev = c.eventi.filter(e => e.tuttoGiorno || e.fine > Date.now());
      frasi.push(ev.length ? `Nel calendario ha ${ev.length === 1 ? "un impegno" : ev.length + " impegni"}: ${elencoEventi(ev)}.` : "Non ha altri impegni in calendario per oggi.");

    const p = await agenteDati({ azione:"posta_ultime" });

// Una chiamata a Groq con gli strumenti (senza streaming: le chiamate a strumenti sono più affidabili così)
async function chiediGroqStrumenti(msg) {
  let ultimo = "nessuna risposta";
  for (const modello of modelliGroq) {
    const r = await fetch(GROQ_URL + "/chat/completions", {
      method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CHIAVE_GROQ },
      body:JSON.stringify({ model:modello, tools:STRUMENTI, tool_choice:"auto", max_completion_tokens:4000,
        ...(modello.startsWith("openai/gpt-oss") ? { reasoning_effort:"low" } : {}),
        messages:[{ role:"system", content:sistemaConContesto() + ISTRUZIONI_STRUMENTI }, ...msg] })
    });
    const d = await r.json().catch(() => ({}));
    const m = d.choices?.[0]?.message;
    if (r.ok && m) return m;
    ultimo = (typeof d.error === "string" ? d.error : d.error?.message) || ("codice " + r.status);
    if (r.status === 401) break;
    scrivi("", `Groq (${modello}): ${ultimo}`, "sys");
  }
  throw new Error(ultimo);
}

async function rispondiConStrumenti(domanda) {
  impostaStato("pensa"); silenzio = false; ultimoParlato = ""; speechSynthesis.cancel();
  if (!modelliAggiornati) { modelliAggiornati = true; await aggiornaModelliGroq(); }
  const lavoro = [...storia, { role:"user", content:domanda }];
  const flusso = creaParlatore(); let riga = null, finale = "", iniziato = false;
  const dire = t => {
    t = t.replace(/[*#`_]/g, "").trim(); if (!t) return;
    if (!riga) { riga = document.createElement("div"); riga.textContent = "Jarvis:"; log.appendChild(riga); }
    riga.textContent += " " + t; log.scrollTop = log.scrollHeight; ultimoParlato += " " + t; flusso.aggiungi(t);
  };
  try {
    for (let giro = 0; giro < 6; giro++) {
      const m = await chiediGroqStrumenti(lavoro);
      iniziato = true;
      if (m.content) dire(m.content);
      if (!m.tool_calls?.length) { finale = m.content || ""; break; }
      lavoro.push({ role:"assistant", content:m.content || null, tool_calls:m.tool_calls });
      for (const c of m.tool_calls) {
        let args = {}; try { args = JSON.parse(c.function.arguments || "{}"); } catch (e) {}
        scrivi("", `Strumento: ${c.function.name} ${JSON.stringify(args).slice(0, 90)}`, "sys");
        let esito;
        try { esito = await (ESEGUI[c.function.name] || (async () => "strumento sconosciuto"))(args); } catch (e) { esito = "errore: " + e.message; }
        lavoro.push({ role:"tool", tool_call_id:c.id, content:String(esito).slice(0, 2500) });
      }
      if (confermaPendente) break;                    // c'è una conferma da chiedere: si ferma qui
    }
  } catch (e) {
    if (!iniziato) { await flusso.chiudi(); return rispondi(domanda); }    // gli strumenti non funzionano: risposta normale
    scrivi("", "Groq: " + descriviErrore(e), "sys");
  }
  await flusso.chiudi();
  if (finale.trim() || confermaPendente) {
    storia.push({ role:"user", content:domanda }, { role:"assistant", content:finale.trim() || "(in attesa di conferma)" });
    if (storia.length > 10) storia = storia.slice(-10);
  }
  if (confermaPendente) await parla(confermaPendente.domanda);
  else if (!finale.trim()) await parla("Non sono riuscito a completare la richiesta, signore.");
}

function ricampiona(campioni, da, a) {             // porta l'audio a 16 kHz facendo la media dei campioni (evita le distorsioni)

    let somma = 0; for (let k = inizio; k < fine; k++) somma += campioni[k];
    fuori[i] = somma / (fine - inizio);
  }
  return fuori;
}
function wavDaCampioni(campioni, freq) {            // audio mono a 16 bit in formato WAV

  testo(0, "RIFF"); dv.setUint32(4, 36 + campioni.length * 2, true); testo(8, "WAVE"); testo(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, freq, true);
  dv.setUint32(28, freq * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); testo(36, "data"); dv.setUint32(40, campioni.length * 2, true);

  const ctx = new (window.AudioContext || window.webkitAudioContext)(), pezzi = [];
  const sorgente = ctx.createMediaStreamSource(flusso), proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = e => pezzi.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  sorgente.connect(proc); proc.connect(ctx.destination);

  else await (CHIAVE_GROQ ? rispondiConStrumenti(c) : rispondi(c));
}

// Frase sentita subito dopo che Jarvis ha parlato, o molto simile a ciò che ha detto: è l'eco degli altoparlanti, non l'utente
function eco(frase) {
  if (parlando || Date.now() < fineParlato + 1200) return true;
  const parole = frase.split(/\s+/).filter(x => x.length > 2), detto = ultimoParlato.toLowerCase();
  return parole.length >= 3 && parole.filter(x => detto.includes(x)).length / parole.length >= 0.7;
}
// Richiesta composta ("cerca X e poi fammi le slide"): non è una semplice ricerca, la gestisce l'IA con gli strumenti
const SEQUENZA = /\b(e poi|e dopo|dopodiché|dopodiche|e quindi|e successivamente|poi)\b/;
const AZIONE_DOPO = /(\be|,|;)\s*(fammi|facci|crea|creami|prepara|preparami|scrivi|scrivimi|genera|riassumi|mandami|salva|ricordami|apri)\b/;
const DOCUMENTI = /\b(power ?point|presentazione|slide|diapositive?|excel|foglio di calcolo|documento|word)\b/;
const eComposto = c => SEQUENZA.test(c) || AZIONE_DOPO.test(c) || (/^(cerca|ricerca)\s/.test(c) && DOCUMENTI.test(c));
const CONGEDI = /^(grazie|grazie mille|ok grazie|va bene così|basta così|a posto così|niente|nulla|non importa)\b/;

async function gestisci(frase) {
  if (occupato) return;
  let comando, chiudiFinestra = false;
  const inConversazione = !TELEFONO && Date.now() < finestraFino;
  if (TELEFONO) { comando = (/^\s*[a-zà-ù]+/.test(frase) && PAROLA_ORDINE.test(frase.split(" ").slice(0, 2).join(" ")) ? dopoParolaOrdine(frase) : frase).trim(); inAttesa = false; if (!comando) return; }
  else if (inAttesa) { comando = frase; inAttesa = false; }
  else if (PAROLA_ORDINE.test(frase)) {
    comando = dopoParolaOrdine(frase);
    if (!comando) { scrivi("Tu", frase, "tu"); inAttesa = true; occupato = true; await parla("Mi dica, signore."); occupato = false; return; }
  }
  else if (inConversazione && !eco(frase)) {                         // conversazione: niente parola d'ordine
    comando = frase.trim();
    if (comando.split(/\s+/).length < 2 && !CONGEDI.test(comando)) return;   // ignora rumori di una parola
  }
  else return;
  occupato = true;
  scrivi("Tu", frase, "tu");
  if (!TELEFONO && CONGEDI.test(comando)) { chiudiFinestra = true; await parla("Prego, signore."); }
  else await eseguiComando(comando);
  occupato = false;
  if (!TELEFONO && attivo && !chiudiFinestra) finestraFino = Date.now() + FINESTRA_MS;   // riparte il tempo di conversazione
  if (chiudiFinestra) finestraFino = 0;
  if (attivo && !parlando) impostaStato("ascolto");
}

// ----- Orecchie -----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = SR ? new SR() : null;
if (!rec) { alert("Questo browser non supporta il riconoscimento vocale. Usa Edge o Chrome."); }
else {
  rec.lang = "it-IT"; rec.continuous = !TELEFONO; rec.interimResults = false;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal || parlando) continue;
      gestisci(e.results[i][0].transcript.toLowerCase());
    }
  };
  rec.onend = () => {
    if (TELEFONO) { if (stato === "ascolto") impostaStato("idle"); return; }
    if (attivo) setTimeout(() => { try { rec.start(); } catch (e) {} }, 300);
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      scrivi("", "Microfono bloccato: clicca il lucchetto nella barra degli indirizzi e consentilo.", "sys");
      attivo = false; btn.textContent = "Attiva Jarvis"; impostaStato("idle");
    }
  };
}

async function avvia() {
  primaConfigurazione();
  attivo = true; btn.textContent = "Disattiva Jarvis";
  scegliVoce();
  scrivi("", "Cervello online: Groq tramite " + hostGroq() + (CHIAVE_GROQ ? " (chiave presente)" : " (nessuna chiave)"), "sys");
  scrivi("", "Voce in uso: " + (voce ? voce.name : "predefinita") + " | Voci italiane: " + (vociItaliane().map(v => v.name).join("; ") || "nessuna"), "sys");
  if (PRIMA_IL_PC) fetch(OLLAMA_URL + "/api/generate", { method:"POST", body:JSON.stringify({ model:MODELLO_LOCALE, keep_alive:"5m" }) }).catch(() => {});   // carica il modello in anticipo
  await parla("Sistemi online. Sono a sua disposizione, signore.");
  try { rec.start(); } catch (e) {}
  if (location.hash === "#auto" && BRIEFING_AUTOMATICO) briefingAutomatico();   // al mattino, una volta al giorno
}
setInterval(() => { if (!TELEFONO && attivo && stato === "ascolto") etichetta.textContent = Date.now() < finestraFino ? "In conversazione" : "In ascolto"; }, 500);
addEventListener("keydown", e => { if (e.key === "Escape") { silenzio = true; speechSynthesis.cancel(); } });   // Esc = zittisce Jarvis
function fermati() { attivo = false; try { rec.stop(); } catch (e) {} btn.textContent = "Attiva Jarvis"; impostaStato("idle"); }
async function tocca() {                              // telefono: un tocco = una frase
  if (parlando) { silenzio = true; speechSynthesis.cancel(); return; }  // toccando mentre parla, lo zittisci
  if (occupato || !rec) return;
  if (!attivo) {
    primaConfigurazione();
    attivo = true; scegliVoce();
    scrivi("", "Cervello online: Groq tramite " + hostGroq() + (CHIAVE_GROQ ? " (chiave presente)" : " (nessuna chiave)"), "sys");
    scrivi("", "Voce in uso: " + (voce ? voce.name : "predefinita"), "sys");
    if (PRIMA_IL_PC) fetch(OLLAMA_URL + "/api/generate", { method:"POST", body:JSON.stringify({ model:MODELLO_LOCALE, keep_alive:"5m" }) }).catch(() => {});
  }
  impostaStato("ascolto");
  try { rec.start(); } catch (e) {}
}
if (TELEFONO) btn.textContent = "Tocca e parla";
btn.onclick = () => (TELEFONO ? tocca() : (attivo ? fermati() : avvia()));

// ----- Pannelli della plancia -----
const el = id => document.getElementById(id);
const maiuscola = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtOra = ms => new Date(ms).toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
function vuota(ul, testo) { ul.innerHTML = ""; const li = document.createElement("li"); li.textContent = testo; li.style.opacity = .7; ul.appendChild(li); }
function riempi(ul, righe) {            // textContent: il testo delle email non viene mai interpretato come codice
  ul.innerHTML = "";
  for (const [a, b] of righe) { const li = document.createElement("li"), s = document.createElement("span"); s.textContent = a; li.append(s, " " + b); ul.appendChild(li); }
}
function orologio() {
  const d = new Date();
  el("orologio").textContent = d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  el("data").textContent = maiuscola(d.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" }));
}
setInterval(orologio, 1000); orologio();

function mostraBatteria(b) {
  const p = Math.round(b.level * 100); el("b-batt").style.width = p + "%";
  const resto = isFinite(b.dischargingTime) && !b.charging && b.dischargingTime > 0 ? ` · autonomia ${Math.floor(b.dischargingTime / 3600)} h ${Math.round(b.dischargingTime % 3600 / 60)} min` : "";
  el("batt").textContent = `${TELEFONO ? "Batteria telefono" : "Batteria PC"} ${p}% · ${b.charging ? "in carica" : "a batteria"}${resto}`;
}
if (navigator.getBattery) navigator.getBattery().then(b => { mostraBatteria(b); ["levelchange", "chargingchange", "dischargingtimechange"].forEach(e => b.addEventListener(e, () => mostraBatteria(b))); }).catch(() => {});
else el("batt").textContent = "Batteria non disponibile in questo browser";

async function aggiornaMeteo() {
  try {
    const oggi = await meteo("Milano", 0), dom = await meteo("Milano", 1);
    el("m-temp").textContent = Math.round(oggi.adesso) + "°C";
    el("m-desc").textContent = `${maiuscola(descMeteo(oggi.codiceAdesso))} · max ${Math.round(oggi.max)}° · min ${Math.round(oggi.min)}°` + (oggi.pioggia >= 0.5 ? ` · pioggia ${Math.round(oggi.pioggia)} mm` : "");
    el("m-dom").textContent = `Domani: ${descMeteo(dom.codice)}, ${Math.round(dom.min)}°/${Math.round(dom.max)}°`;
  } catch (e) { el("m-desc").textContent = "Meteo non disponibile"; }
}
async function aggiornaPosta() {
  const ul = el("e-posta"), n = el("n-posta");
  if (!agenteAttivo) { n.textContent = ""; return vuota(ul, "Computer non collegato"); }
  const r = await agenteDati({ azione:"posta_ultime" });
  if (!r) return vuota(ul, "Posta non raggiungibile");
  if (!r.configurata) { n.textContent = ""; return vuota(ul, "Gmail non configurato"); }
  if (r.errore) return vuota(ul, "Errore: " + r.errore);
  n.textContent = r.ultime.length ? String(r.ultime.length) : "";
  r.ultime.length ? riempi(ul, r.ultime.map(e => [e.da, e.oggetto])) : vuota(ul, "Nessuna email importante non letta");
}
async function aggiornaCalendario() {
  const ul = el("e-cal"), n = el("n-cal");
  if (!agenteAttivo) { n.textContent = ""; return vuota(ul, "Computer non collegato"); }
  const [a, b] = await Promise.all([agenteDati({ azione:"calendario_oggi", giorno:0 }), agenteDati({ azione:"calendario_oggi", giorno:1 })]);
  if (!a) return vuota(ul, "Calendario non raggiungibile");
  if (!a.configurata) { n.textContent = ""; return vuota(ul, "Calendario non configurato"); }
  if (a.errore) return vuota(ul, "Errore: " + a.errore);
  const ora = Date.now();
  const righe = [...a.eventi.filter(e => e.tuttoGiorno || e.fine > ora).map(e => ["Oggi", e]), ...((b && b.eventi) || []).map(e => ["Domani", e])].slice(0, 6);
  n.textContent = righe.length ? String(righe.length) : "";
  righe.length ? riempi(ul, righe.map(([g, e]) => { const min = Math.round((e.inizio - ora) / 6e4);
    return [g + (e.tuttoGiorno ? "" : " " + fmtOra(e.inizio)), e.titolo + (!e.tuttoGiorno && min > 0 && min <= 60 ? ` (tra ${min} min)` : "")]; }))
               : vuota(ul, "Nessun impegno per oggi e domani");
}
function aggiornaTesta() {
  el("s-cervello").textContent = "CERVELLO: " + (CHIAVE_GROQ ? "GROQ" : agenteAttivo ? "PC" : "NESSUNO");
  el("s-pc").textContent = "COMPUTER: " + (agenteAttivo ? "COLLEGATO" : "NON COLLEGATO");
}
const aggiornaTutto = async () => { aggiornaTesta(); await Promise.all([aggiornaPosta(), aggiornaCalendario()]); };
aggiornaTesta(); sonda.then(aggiornaTutto);
aggiornaMeteo(); setInterval(aggiornaMeteo, 15 * 60000); setInterval(aggiornaTutto, 60000);
el("b-agg").onclick = () => { aggiornaMeteo(); aggiornaTutto(); };
el("b-zitto").onclick = () => { silenzio = true; speechSynthesis.cancel(); };
el("b-voce").onclick = () => cambiaVoce();

// ----- Disegno: l'anello HUD si apre e diventa la plancia -----
const cv = el("cv"), ctx = cv.getContext("2d"), onda = el("onda"), co = onda.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
const riduci = matchMedia("(prefers-reduced-motion: reduce)").matches;
function ridimensiona() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; onda.width = Math.max(1, onda.clientWidth * dpr | 0); onda.height = Math.max(1, onda.clientHeight * dpr | 0); }
addEventListener("resize", ridimensiona); ridimensiona();

const N = 480, punti = [];
for (let i = 0; i < N; i++) { const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.399963; punti.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
let t = 0, ang = 0, energia = 0, apertura = 0, vistaAperta = false;
const lerp = (a, b, x) => a + (b - a) * x, TAU = Math.PI * 2;
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const C1 = a => `rgba(56,189,248,${a})`, C2 = a => `rgba(34,211,238,${a})`, C3 = a => `rgba(186,230,253,${a})`;
function arco(r, a0, a1, larg, col) { ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.lineWidth = larg * dpr; ctx.strokeStyle = col; ctx.stroke(); }
function arcoLuce(r, a0, a1, larg, al) { arco(r, a0, a1, larg * 3.4, C2(al * .16)); arco(r, a0, a1, larg, C3(al)); }   // bagliore finto, senza shadowBlur

function hud(R, k) {                                // anelli concentrici come nella grafica di riferimento
  const T = t * (stato === "pensa" ? 2.2 : stato === "parla" ? 1.4 : 1) * (riduci ? .2 : 1);
  ctx.setLineDash([]);
  arco(R, 0, TAU, 1, C1(.55 * k));
  ctx.save(); ctx.rotate(T * .12); arcoLuce(R * .975, -.5, .35, 3, .9 * k); arcoLuce(R * .975, 2.3, 2.75, 3, .9 * k); arcoLuce(R * .975, 3.9, 4.6, 2, .7 * k); ctx.restore();
  ctx.save(); ctx.rotate(-T * .08); ctx.setLineDash([1.5 * dpr, 7 * dpr]); arco(R * .9, 0, TAU, 2, C3(.7 * k)); ctx.restore(); ctx.setLineDash([]);
  ctx.beginPath(); for (let i = 0; i < 120; i++) { const a = i * Math.PI / 60, l = i % 10 === 0 ? .74 : .775; ctx.moveTo(Math.cos(a) * R * .8, Math.sin(a) * R * .8); ctx.lineTo(Math.cos(a) * R * l, Math.sin(a) * R * l); }
  ctx.lineWidth = dpr; ctx.strokeStyle = C1(.75 * k); ctx.stroke();
  arco(R * .8, 0, TAU, 1, C1(.45 * k));
  ctx.strokeStyle = C1(.9 * k); ctx.lineWidth = dpr;                                             // fasce di riquadri
  for (const [rr, da, v, n] of [[.66, -2.4, .05, 30], [.585, .5, -.04, 20]]) { ctx.save(); ctx.rotate(T * v);
    for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(da + i * .075); ctx.strokeRect(R * rr, -4 * dpr, 7 * dpr, 8 * dpr); ctx.restore(); } ctx.restore(); }
  ctx.beginPath(); for (let i = 0; i < 16; i++) {                                               // barre "equalizzatore"
    const a = 2.55 + i * .085, r0 = R * .56, l = R * (.05 + .05 * (Math.sin(t * 3 + i) * .5 + .5) + energia * .06);
    ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * (r0 + l), Math.sin(a) * (r0 + l)); }
  ctx.lineWidth = 3 * dpr; ctx.strokeStyle = C3(.8 * k); ctx.stroke();
  arco(R * .46, 0, TAU, 1, C1(.5 * k));
  ctx.save(); ctx.rotate(-T * .2); ctx.setLineDash([10 * dpr, 6 * dpr]); arco(R * .5, .2, 4.2, 1.5, C2(.7 * k)); ctx.restore(); ctx.setLineDash([]);
}
function anelloCentrale(r, k) { arcoLuce(r, 0, TAU, 2.6, .95 * k); arco(r * .86, 0, TAU, 1, C1(.7 * k)); }
function piattaforma(Ro, k) { for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, Ro * (1.5 + i * .06), Ro * (1.55 - i * .3), Ro * (.3 - i * .06), 0, 0, TAU); ctx.lineWidth = (i ? 1 : 2) * dpr; ctx.strokeStyle = C2((.55 - i * .13 + energia * .3) * k); ctx.stroke(); } }
function sfera(Ro, k) {
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, Ro * 1.9); g.addColorStop(0, C2((.2 + energia * .4) * k)); g.addColorStop(1, C2(0)); ctx.fillStyle = g; ctx.fillRect(-Ro * 2, -Ro * 2, Ro * 4, Ro * 4);
  const R = Ro * (1 + energia * .1), ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(.35), st = Math.sin(.35);
  for (const p of punti) {
    const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca, y = p[1] * ct - z * st, z2 = p[1] * st + z * ct, f = 1 + z2 * .2, s = (1 + (z2 + 1) * .9) * dpr;
    ctx.fillStyle = `rgba(${110 + z2 * 60 | 0},${205 + z2 * 40 | 0},255,${(.15 + .75 * (z2 + 1) / 2) * k})`; ctx.fillRect(x * R * f, y * R * f, s, s);
  }
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, 0, R, R * Math.abs(Math.cos(ang * .5 + i * 1.05)), 0, 0, TAU); ctx.lineWidth = dpr; ctx.strokeStyle = C1(.35 * k); ctx.stroke(); }
  const rn = R * (.14 + energia * .1); g = ctx.createRadialGradient(0, 0, 0, 0, 0, rn * 3);
  g.addColorStop(0, `rgba(224,242,254,${.95 * k})`); g.addColorStop(.3, C2((.55 + energia * .4) * k)); g.addColorStop(1, C2(0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rn * 3, 0, TAU); ctx.fill();
}
function disegnaOnda() {                            // animazione che segue lo stato di Jarvis (non è l'audio reale)
  if (!vistaAperta) return;
  if (onda.width !== (onda.clientWidth * dpr | 0)) ridimensiona();
  const W = onda.width, H = onda.height; co.clearRect(0, 0, W, H);
  co.strokeStyle = "rgba(56,189,248,.16)"; co.lineWidth = 1; for (let y = 1; y < 4; y++) { co.beginPath(); co.moveTo(0, H * y / 4); co.lineTo(W, H * y / 4); co.stroke(); }
  const amp = stato === "parla" ? .2 + energia * .75 : stato === "pensa" ? .24 : stato === "ascolto" ? .12 : .05;
  co.beginPath(); co.strokeStyle = "#22d3ee"; co.lineWidth = 1.6 * dpr;
  for (let i = 0; i <= 90; i++) { const x = i / 90 * W, f = Math.sin(i * .55 + t * 9) * Math.sin(i * .17 - t * 3) * (.4 + .6 * Math.abs(Math.sin(i * .31 + t * 2))), y = H / 2 + f * amp * H * .5; i ? co.lineTo(x, y) : co.moveTo(x, y); }
  co.stroke();
}

function disegna() {
  t += 0.016;
  if (attivo !== vistaAperta) { vistaAperta = attivo; document.body.classList.toggle("aperto", attivo); setTimeout(ridimensiona, 50); }
  apertura += ((attivo ? 1 : 0) - apertura) * (riduci ? 1 : .05);
  const a = ease(Math.min(1, Math.max(0, apertura))), w = cv.width, h = cv.height, stretto = innerWidth < 900;
  const bersaglio = stato === "parla" ? .55 + .45 * Math.abs(Math.sin(t * 7.5) * Math.sin(t * 2.3 + 1)) : stato === "pensa" ? .35 + .2 * Math.sin(t * 5) : stato === "ascolto" ? .14 + .08 * Math.sin(t * 1.8) : .08 + .05 * Math.sin(t * 1.2);
  energia += (bersaglio - energia) * .18; ang += (stato === "pensa" ? .014 : stato === "parla" ? .008 : .004) * (riduci ? .2 : 1);

  const R0 = Math.min(w, h) * .4;
  const laterale = (Math.min(340, Math.max(230, innerWidth * .24)) + 34) * dpr, Ra = stretto ? Math.min(w * .34, h * .17) : Math.min((w - 2 * laterale) * .47, h * .35);
  const R = lerp(R0, Ra, a), cx = w / 2, cy = lerp(h / 2, stretto ? h * .21 : h * .5, a);
  ctx.clearRect(0, 0, w, h);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3); g.addColorStop(0, C2(.1 + a * .08 + energia * .12)); g.addColorStop(1, C2(0)); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.translate(cx, cy);
  hud(R, lerp(1, .8, a));
  if (a < .99) anelloCentrale(R * .34, 1 - a);
  if (a > .01) { piattaforma(R * .4, a); sfera(R * .4, a); }
  ctx.restore();
  disegnaOnda();
  requestAnimationFrame(disegna);
}
disegna();

// Avvio automatico quando la pagina è aperta con #auto (usato all'accensione del PC)
if (location.hash === "#auto") setTimeout(avvia, 1000);
</script>
